[package]
name = "ark-circom"
version = "0.5.0"
edition = "2024"
description = "Arkworks bindings to Circom's R1CS, for Groth16 Proof and Witness generation in Rust"
homepage = "https://arkworks.rs"
repository = "https://github.com/arkworks-rs/circom-compat"
license = "MIT OR Apache-2.0"
resolver = "2"

# WASM operations
# see also https://github.com/wasmerio/wasmer/pull/6554
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { git = "https://github.com/NethermindEth/wasmer.git", default-features = false, features = ["wasmi"], branch = "wasm-bingen-7.1.0" }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmer = { git = "https://github.com/NethermindEth/wasmer.git", default-features = false, features = ["js", "js-default"], branch = "wasm-bingen-7.1.0" }

[dependencies]
fnv = { version = "1.0.7", default-features = false }
num = { version = "0.4.3" }
num-traits = { version = "0.2", default-features = false }
num-bigint = {version = "0.4.6", default-features = false, features = [ "rand" ] }

# ZKP Generation
ark-crypto-primitives = { version = "0.6.0", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false}
ark-std = { version = "0.6.0", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.6.0" }
ark-groth16 = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-relations = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
rayon = { version = "1.5.0" }


# decoding of data
hex = "0.4"
byteorder = "1.4.3"

# error handling
thiserror = "2"
color-eyre = "0.6.2"

cfg-if = "1.0"

# Serializ & Deserialize
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }

[dev-dependencies]
hex-literal = "1.0"
serde_json = "1.0"

[[bench]]
name = "groth16"
harness = false

[features]
default = []
bench-complex-all = []
parallel = [
    "ark-crypto-primitives/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-std/parallel",
    "ark-groth16/parallel",
    "ark-poly/parallel",
]
